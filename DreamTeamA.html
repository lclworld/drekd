<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Team A</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0a1628;
  --navy2: #112240;
  --sea: #1e6fa5;
  --sea2: #2196c4;
  --sea-light: #64b5d9;
  --white: #ffffff;
  --off-white: #f4f8fb;
  --black: #0a0a0a;
  --gray: #6b7a8d;
  --gray-light: #e8eef4;
  --success: #2ecc71;
  --warning: #f39c12;
  --danger: #e74c3c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--navy);
  color: var(--white);
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  border-bottom: 2px solid var(--sea);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.header-logo { display:flex; align-items:center; gap:12px; }
.header-logo .icon {
  width:40px; height:40px; background: linear-gradient(135deg, var(--sea), var(--sea2));
  border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.header-title { font-size:20px; font-weight:800; letter-spacing:-0.5px; }
.header-title span { color: var(--sea-light); }
.header-date { font-size:12px; color: var(--sea-light); font-weight:500; }

/* ── NAV ── */
.nav {
  background: var(--navy2);
  display: flex;
  overflow-x: auto;
  border-bottom: 1px solid rgba(30,111,165,0.3);
  padding: 0 24px;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display:none; }
.nav-btn {
  padding: 14px 20px;
  border: none;
  background: none;
  color: var(--gray);
  font-family: 'Poppins', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.nav-btn:hover { color: var(--sea-light); }
.nav-btn.active { color: var(--sea2); border-bottom-color: var(--sea2); }

/* ── MAIN ── */
.main { padding: 24px; max-width: 900px; margin: 0 auto; }

/* ── SECTION ── */
.section { display:none; animation: fadeIn 0.3s ease; }
.section.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* ── CARDS ── */
.card {
  background: var(--navy2);
  border: 1px solid rgba(30,111,165,0.25);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}
.card-title {
  font-size: 15px; font-weight: 700; color: var(--sea-light);
  margin-bottom: 16px; display:flex; align-items:center; gap:8px;
}
.card-title .dot {
  width:8px; height:8px; border-radius:50%; background: var(--sea2);
}

/* ── LOOKUP ── */
.lookup-row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
.lookup-group { flex:1; min-width:200px; }
.lookup-group label { display:block; font-size:12px; color:var(--sea-light); font-weight:600; margin-bottom:8px; letter-spacing:0.5px; text-transform:uppercase; }
.lookup-group select, .lookup-group input {
  width:100%; padding:12px 16px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(30,111,165,0.4);
  border-radius:10px;
  color: var(--white);
  font-family: 'Poppins', sans-serif;
  font-size:14px;
  outline:none;
  transition: border 0.2s;
}
.lookup-group select:focus, .lookup-group input:focus {
  border-color: var(--sea2);
  background: rgba(33,150,196,0.1);
}
.lookup-group select option { background: var(--navy2); }
.btn-lookup {
  padding: 12px 28px;
  background: linear-gradient(135deg, var(--sea), var(--sea2));
  border: none; border-radius: 10px;
  color: white; font-family: 'Poppins', sans-serif;
  font-size: 14px; font-weight: 700;
  cursor: pointer; align-self: flex-end;
  transition: opacity 0.2s, transform 0.1s;
  letter-spacing: 0.3px;
}
.btn-lookup:hover { opacity:0.9; transform:translateY(-1px); }
.btn-lookup:active { transform:translateY(0); }

/* ── RESULT ── */
.result-hidden { display:none; }
.result-badge {
  display:inline-flex; align-items:center; gap:8px;
  padding: 8px 18px;
  border-radius: 100px;
  font-size: 13px; font-weight: 700;
  margin-bottom: 20px;
}
.badge-obs { background: rgba(33,150,196,0.2); border:1px solid var(--sea2); color:var(--sea-light); }
.badge-gynae { background: rgba(46,204,113,0.15); border:1px solid #2ecc71; color:#2ecc71; }
.badge-float { background: rgba(243,156,18,0.15); border:1px solid #f39c12; color:#f39c12; }
.badge-leave { background: rgba(231,76,60,0.15); border:1px solid #e74c3c; color:#e74c3c; }

.duties-section { margin-bottom:20px; }
.duties-label {
  font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--gray); margin-bottom:10px;
  padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,0.08);
}
.duty-item {
  display:flex; gap:10px; align-items:flex-start;
  padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);
  font-size:13px; line-height:1.6; color:rgba(255,255,255,0.85);
}
.duty-item:last-child { border-bottom:none; }
.duty-item .bullet {
  width:6px; height:6px; border-radius:50%; background:var(--sea2);
  margin-top:7px; flex-shrink:0;
}
.duty-time {
  font-size:11px; font-weight:700; color:var(--sea2);
  background: rgba(33,150,196,0.1); padding:2px 8px; border-radius:4px;
  white-space:nowrap; margin-top:2px;
}

/* ── MEDS ── */
.scenario-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:12px; margin-bottom:20px; }
.scenario-card {
  padding:16px; background:rgba(255,255,255,0.04);
  border:1px solid rgba(30,111,165,0.25); border-radius:12px;
  cursor:pointer; transition:all 0.2s;
}
.scenario-card:hover { background:rgba(33,150,196,0.12); border-color:var(--sea2); transform:translateY(-2px); }
.scenario-card.selected { background:rgba(33,150,196,0.18); border-color:var(--sea2); }
.scenario-card .s-icon { font-size:24px; margin-bottom:8px; }
.scenario-card .s-title { font-size:13px; font-weight:600; color:var(--white); }
.scenario-card .s-sub { font-size:11px; color:var(--gray); margin-top:4px; }

.med-result { display:none; background: var(--navy2) !important; color: var(--white) !important; }
.med-result.show { display:block; }
.med-result * { color: inherit; }
.med-result .card-title { color: var(--sea-light) !important; }
.med-result .duties-label { color: var(--gray) !important; }
.med-result .med-table td { color: rgba(255,255,255,0.85) !important; background: transparent !important; }
.med-result .med-table td small { color: #f39c12 !important; }
.med-result .med-table th { color: var(--sea-light) !important; background: rgba(33,150,196,0.2) !important; }
.med-result .med-table tr:hover td { background: rgba(255,255,255,0.04) !important; }
.med-result .check-text { color: rgba(255,255,255,0.85) !important; }
.med-result .check-text.done { color: var(--gray) !important; }
.med-result .note-box { color: #f39c12 !important; background: rgba(243,156,18,0.1) !important; }
.med-table { width:100%; border-collapse:collapse; margin-top:12px; }
.med-table th {
  background: rgba(33,150,196,0.2); padding:10px 14px;
  text-align:left; font-size:12px; font-weight:700;
  color:var(--sea-light); letter-spacing:0.5px;
}
.med-table th:first-child { border-radius:8px 0 0 0; }
.med-table th:last-child { border-radius:0 8px 0 0; }
.med-table td {
  padding:10px 14px; font-size:13px;
  border-bottom:1px solid rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.85);
}
.med-table tr:hover td { background:rgba(255,255,255,0.03); }
.note-box {
  background:rgba(243,156,18,0.1); border:1px solid rgba(243,156,18,0.3);
  border-radius:10px; padding:14px; margin-top:14px;
  font-size:13px; color:#f39c12; line-height:1.6;
}
.note-box strong { display:block; margin-bottom:4px; font-size:12px; letter-spacing:0.5px; }

/* ── CONTACTS ── */
.contacts-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:12px; }
.contact-card {
  background:rgba(255,255,255,0.04); border:1px solid rgba(30,111,165,0.25);
  border-radius:12px; padding:18px; transition:all 0.2s;
}
.contact-card:hover { background:rgba(33,150,196,0.1); border-color:var(--sea2); }
.contact-card .c-role { font-size:11px; color:var(--sea-light); font-weight:700; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:6px; }
.contact-card .c-name { font-size:14px; font-weight:600; color:var(--white); margin-bottom:8px; }
.contact-card .c-num {
  font-size:13px; color:var(--sea2); font-weight:500;
  display:flex; align-items:center; gap:6px;
}
.contact-cat { font-size:12px; font-weight:700; color:var(--sea-light); letter-spacing:1px; text-transform:uppercase; margin:20px 0 10px; }

/* ── POST DUTY ── */
.checklist-item {
  display:flex; gap:12px; align-items:flex-start;
  padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06);
}
.checklist-item:last-child { border-bottom:none; }
.check-box {
  width:20px; height:20px; border:2px solid var(--sea2);
  border-radius:5px; flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; margin-top:2px;
}
.check-box.checked { background:var(--sea2); }
.check-box.checked::after { content:'✓'; color:white; font-size:12px; font-weight:700; }
.check-text { font-size:13px; color:rgba(255,255,255,0.85); line-height:1.6; }
.check-text.done { text-decoration:line-through; color:var(--gray); }
.section-label {
  font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  color:var(--sea2); margin:20px 0 10px;
  display:flex; align-items:center; gap:8px;
}
.section-label::after { content:''; flex:1; height:1px; background:rgba(30,111,165,0.3); }

/* ── PAGE TITLE ── */
.page-title { font-size:22px; font-weight:800; margin-bottom:6px; }
.page-sub { font-size:13px; color:var(--gray); margin-bottom:24px; }

/* ── LEAVE NOTICE ── */
.leave-notice {
  background:rgba(231,76,60,0.1); border:1px solid rgba(231,76,60,0.3);
  border-radius:12px; padding:20px; text-align:center;
}
.leave-notice .l-icon { font-size:32px; margin-bottom:8px; }
.leave-notice .l-title { font-size:16px; font-weight:700; color:#e74c3c; margin-bottom:6px; }
.leave-notice .l-text { font-size:13px; color:rgba(255,255,255,0.7); line-height:1.6; }

/* ── RESPONSIVE ── */
@media(max-width:600px) {
  .main { padding:16px; }
  .lookup-row { flex-direction:column; }
  .btn-lookup { width:100%; }
}

<script>
// ── DATE HEADER ──────────────────────────────────────────────────────────────
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const now = new Date();
document.getElementById('headerDate').textContent =
  days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
document.getElementById('dateInput').value = now.toISOString().split('T')[0];

// ── NAV ──────────────────────────────────────────────────────────────────────
function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  event.target.classList.add('active');
}

// ── ROTA LOGIC ───────────────────────────────────────────────────────────────
const LEAVE = {
  Fatima:  ['2026-06-01','2026-06-24'],
  Winston: ['2026-06-29','2026-07-22'],
  Daniel:  ['2026-07-24','2026-08-18'],
  Efua:    ['2026-08-20','2026-09-14'],
  Bertha:  ['2026-09-16','2026-10-09'],
  Messiah: ['2026-10-12','2026-11-04'],
  Samira:  ['2026-11-06','2026-12-01'],
};

function toD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function dateStr(d){ return d.toISOString().split('T')[0]; }

function getPersonOnLeave(d) {
  for(const [p,[s,e]] of Object.entries(LEAVE)) {
    if(d >= toD(s) && d <= toD(e)) return p;
  }
  return null;
}

function getPairs(d) {
  const ds = dateStr(d);
  let A, B, C;
  if(ds < '2026-06-25')       A = ['Winston','Samira'];
  else if(ds < '2026-06-29')  A = ['Winston/Fatima','Samira'];
  else if(ds < '2026-11-05')  A = ['Fatima','Samira'];
  else if(ds === '2026-11-05') A = ['Fatima','Samira/Messiah'];
  else                         A = ['Fatima','Messiah'];

  if(ds < '2026-07-23')       B = ['Efua','Daniel'];
  else if(ds === '2026-07-23') B = ['Efua','Daniel/Winston'];
  else if(ds < '2026-08-19')  B = ['Efua','Winston'];
  else if(ds === '2026-08-19') B = ['Efua/Daniel','Winston'];
  else                         B = ['Daniel','Winston'];

  if(ds < '2026-09-15')       C = ['Messiah','Bertha'];
  else if(ds === '2026-09-15') C = ['Messiah','Bertha/Efua'];
  else if(ds < '2026-09-16')  C = ['Messiah','Bertha/Efua'];
  else if(ds < '2026-10-10')  C = ['Messiah','Efua'];
  else if(ds === '2026-10-10') C = ['Messiah','Efua/Bertha'];
  else if(ds < '2026-10-12')  C = ['Messiah','Efua'];
  else                         C = ['Bertha','Efua'];

  return {A,B,C};
}

const START = toD('2026-06-01');
const DEPTS = ['Obs','Gynae','Float'];
const DEPT_OFF = {A:0, B:1, C:2};

function weekNum(d){ return Math.floor((d - START) / (7*24*3600*1000)); }

function getDept(pid, wn){ return DEPTS[(wn + DEPT_OFF[pid]) % 3]; }

function getStation(name, d) {
  const onLeave = getPersonOnLeave(d);
  if(onLeave === name) return 'leave';
  const pairs = getPairs(d);
  const wn = weekNum(d);
  for(const [pid, members] of Object.entries(pairs)) {
    const [m0, m1] = wn%2===0 ? members : [members[1], members[0]];
    const dept = getDept(pid, wn);
    const names0 = m0.split('/');
    const names1 = m1.split('/');
    if(names0.includes(name)) return dept + '_C1';
    if(names1.includes(name)) return dept + '_C2';
  }
  return 'unknown';
}

const FP_SCHEDULE = {
  "Daniel":  ['2026-06-29','2026-07-03'],
  "Fatima":  ['2026-07-06','2026-07-10'],
  "Bertha":  ['2026-07-13','2026-07-17'],

  "Winston": ['2026-08-10','2026-08-14'],
};

function isOnFP(name, d) {
  if(!FP_SCHEDULE[name]) return false;
  const [s, e] = FP_SCHEDULE[name].map(toD);
  return d >= s && d <= e;
}

function isFPWeekday(name, d) {
  return isOnFP(name, d) && d.getDay() >= 1 && d.getDay() <= 4;
}

function isFPFriday(name, d) {
  return isOnFP(name, d) && d.getDay() === 5;
}

// ── LOOKUP FUNCTION ──────────────────────────────────────────────────────────
function lookupSchedule() {
  const name = document.getElementById('nameSelect').value;
  const dateVal = document.getElementById('dateInput').value;
  if(!name || !dateVal) { alert('Please select your name and a date.'); return; }

  const d = toD(dateVal);
  const station = getStation(name, d);
  const dayOfWeek = d.getDay();
  const dayName = days[dayOfWeek];
  const result = document.getElementById('scheduleResult');
  const badge = document.getElementById('stationBadge');
  const content = document.getElementById('dutyContent');

  result.classList.remove('result-hidden');

  if(station === 'leave') {
    const [ls, le] = LEAVE[name];
    badge.className = 'result-badge badge-leave';
    badge.innerHTML = '🏖️ On Leave';
    content.innerHTML = `<div class="leave-notice">
      <div class="l-icon">🏖️</div>
      <div class="l-title">${name} is on leave</div>
      <div class="l-text">Leave period: <strong>${toD(ls).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})} — ${toD(le).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</strong><br>Rest well and return refreshed!</div>
    </div>`;
    return;
  }

  const dept = station.replace('_C1','').replace('_C2','');
  const cover = station.includes('C1') ? 'Cover 1' : 'Cover 2';

  const badgeClass = dept==='Obs' ? 'badge-obs' : dept==='Gynae' ? 'badge-gynae' : 'badge-float';
  const deptLabel = dept==='Obs' ? 'Obstetrics' : dept==='Gynae' ? 'Gynaecology' : 'Floater';
  const deptIcon = dept==='Obs' ? '🩺' : dept==='Gynae' ? '🌿' : '🔄';

  badge.className = 'result-badge ' + badgeClass;
  badge.innerHTML = `${deptIcon} ${deptLabel} — ${cover} &nbsp;|&nbsp; ${dayName} ${d.getDate()} ${months[d.getMonth()]}`;

  // Build duties
  let html = '';

  // All HOs
  html += `<div class="duties-section">
    <div class="duties-label">All HOs — Every Day</div>`;
  ALL_DUTIES.forEach(t => {
    html += `<div class="duty-item"><div class="bullet"></div><div>${t}</div></div>`;
  });
  html += `</div>`;

  // Check FP week
  const onFPWeekday = dept === 'Float' && isFPWeekday(name, d);
  const onFPFriday  = dept === 'Float' && isFPFriday(name, d);

  if(onFPWeekday || onFPFriday) {
    // FP banner
    html += `<div class="note-box" style="background:rgba(46,204,113,0.1);border-color:rgba(46,204,113,0.4);color:#2ecc71;margin-bottom:16px;">
      <strong>🏥 FAMILY PLANNING WEEK</strong>
      You are on your Family Planning rotation this week (${toD(FP_SCHEDULE[name][0]).toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${toD(FP_SCHEDULE[name][1]).toLocaleDateString('en-GB',{day:'numeric',month:'short'})})
    </div>`;

    const fpDay = onFPFriday ? 5 : dayOfWeek;
    const fpDuties = [{time: onFPWeekday ? '8:00am–5:00pm' : '8:00am', task: onFPWeekday ? 'Family Planning unit — attend and assist with Family Planning clinic' : 'Join the team for the full 24-hour Friday duty — Family Planning rotation ends today'}];

    html += `<div class="duties-section">
      <div class="duties-label">${onFPWeekday ? 'Family Planning' : 'Friday Duty'} — ${dayName}</div>`;
    fpDuties.forEach(item => {
      html += `<div class="duty-item">
        <div class="bullet"></div>
        <div><span class="duty-time">${item.time}</span> ${item.task}</div>
      </div>`;
    });
    html += `</div>`;
  } else {
    // Station specific
    const stationDuties = DAY_DUTIES[dept] && DAY_DUTIES[dept][dayOfWeek];
    if(stationDuties && stationDuties.length > 0) {
      html += `<div class="duties-section">
        <div class="duties-label">${deptLabel} — ${dayName} Duties</div>`;
      stationDuties.forEach(item => {
        html += `<div class="duty-item">
          <div class="bullet"></div>
          <div><span class="duty-time">${item.time}</span> ${item.task}</div>
        </div>`;
      });
      html += `</div>`;
    }
  }

  content.innerHTML = html;
}

// ── RENDER SCENARIOS ─────────────────────────────────────────────────────────
const grid = document.getElementById('scenarioGrid');
SCENARIOS.forEach(sc => {
  const card = document.createElement('div');
  card.className = 'scenario-card';
  card.innerHTML = `<div class="s-icon">${sc.icon}</div><div class="s-title">${sc.title}</div><div class="s-sub">${sc.sub}</div>`;
  card.onclick = () => showScenario(sc.id);
  grid.appendChild(card);
});

function showScenario(id) {
  const sc = SCENARIOS.find(s => s.id === id);
  const result = document.getElementById('medResult');
  document.querySelectorAll('.scenario-card').forEach(c => c.classList.remove('selected'));
  event.currentTarget.classList.add('selected');

  let html = `<div class="card-title"><div class="dot"></div>${sc.icon} ${sc.title}</div>`;

  if(sc.meds.length > 0) {
    html += `<div class="duties-label" style="margin-bottom:10px">Medications</div>
    <table class="med-table">
      <tr><th>Drug</th><th>Dose</th><th>Duration</th></tr>`;
    sc.meds.forEach(m => {
      html += `<tr><td><strong>${m.drug}</strong>${m.note ? '<br><small style="color:#f39c12">'+m.note+'</small>' : ''}</td><td>${m.dose}</td><td>${m.duration||'—'}</td></tr>`;
    });
    html += `</table>`;
  }

  if(sc.checklist.length > 0) {
    html += `<div class="duties-label" style="margin:16px 0 10px">Checklist</div>`;
    sc.checklist.forEach((item,i) => {
      html += `<div class="checklist-item">
        <div class="check-box" id="chk_${id}_${i}" onclick="toggleCheck('chk_${id}_${i}','txt_${id}_${i}')"></div>
        <div class="check-text" id="txt_${id}_${i}">${item}</div>
      </div>`;
    });
  }

  if(sc.notes) {
    html += `<div class="note-box"><strong>⚠️ NOTE</strong>${sc.notes}</div>`;
  }

  result.innerHTML = html;
  result.classList.add('show');
  result.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function toggleCheck(boxId, txtId) {
  const box = document.getElementById(boxId);
  const txt = document.getElementById(txtId);
  box.classList.toggle('checked');
  txt.classList.toggle('done');
}
