<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Efua & KT · Our Schedule</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

:root {
  --bg: #F8F8FC;
  --surface: #FFFFFF;
  --border: #E4E4F0;
  --white: #FFFFFF;

  --yellow:      #F5C518;
  --yellow-soft: #FFFBEA;
  --yellow-text: #7A5C00;

  --blue:      #4A90D9;
  --blue-soft: #EAF3FC;
  --blue-text: #1A5C99;

  --leave-bg:    #F5F5F5;
  --leave-border:#CCCCCC;
  --leave-text:  #888888;

  --red:      #E03131;
  --red-soft: #FFF0F0;
  --red-text: #B00000;

  --green:      #2F9E44;
  --green-soft: #EBFBEE;
  --green-text: #1A6B2A;

  --love:      #FF2D78;
  --love-soft: #FFF0F5;
  --love-text: #C4005A;
  --love-glow: rgba(255,45,120,0.15);

  --lilac:      #9B59B6;
  --lilac-soft: #F5EEFF;
  --lilac-text: #6A2F8A;

  --teal:      #0097A7;
  --teal-soft: #E0F7FA;
  --teal-text: #006978;

  --gold: #E8A800;

  --text:  #1A1A2E;
  --muted: #888899;
  --dim:   #BBBBCC;

  --radius-sm:  8px;
  --radius-tag: 5px;
  --shadow:      0 2px 10px rgba(0,0,0,0.07);
  --shadow-love: 0 4px 20px rgba(255,45,120,0.18);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Poppins', sans-serif;
  font-size: 13px;
  min-height: 100vh;
}

.header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 24px 20px 18px;
  text-align: center;
}
.header-names { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 4px; }
.header-names .heart { color: var(--love); font-size: 18px; margin: 0 6px; }
.header-sub { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

.legend {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  justify-content: center;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500; color: var(--muted); }
.ldot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

.tabs-wrap {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  align-items: center;
}
.tabs-wrap::-webkit-scrollbar { display: none; }

.tab {
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--muted);
  padding: 6px 16px;
  border-radius: 20px;
  font-family: 'Poppins', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  flex-shrink: 0;
}
.tab:hover { border-color: var(--love); color: var(--love-text); }
.tab.active { background: var(--love); border-color: var(--love); color: var(--white); font-weight: 600; }

.view-toggle { margin-left: auto; display: flex; gap: 4px; flex-shrink: 0; }
.vtab {
  background: var(--bg);
  border: 1.5px solid var(--border);
  color: var(--muted);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  font-family: 'Poppins', sans-serif;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.vtab.active { background: var(--border); color: var(--text); }

.summary-bar { display: flex; gap: 8px; padding: 12px 14px 0; flex-wrap: wrap; }
.summary-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  box-shadow: var(--shadow);
}
.summary-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; }
.summary-chip.love-chip     { border-color: var(--love);  background: var(--love-soft);  color: var(--love-text); }
.summary-chip.possible-chip { border-color: var(--lilac); background: var(--lilac-soft); color: var(--lilac-text); }
.summary-chip.teal-chip     { border-color: var(--teal);  background: var(--teal-soft);  color: var(--teal-text); }

.cal-wrap { padding: 12px 12px 28px; }
.month-section { display: none; }
.month-section.visible { display: block; }

.month-head { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 10px 2px; }
.month-title { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }
.month-meta  { font-size: 11px; font-weight: 400; color: var(--muted); }

.wday-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
.wday { text-align: center; font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 0; }

.days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.day-cell {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 5px 7px;
  min-height: 90px;
  transition: transform 0.12s, box-shadow 0.12s;
  cursor: default;
  position: relative;
}
.day-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow); z-index: 2; }
.day-cell.empty { background: transparent; border-color: transparent; pointer-events: none; }
.day-cell.is-today    { border-color: var(--gold) !important; }
.day-cell.is-love     { border-color: var(--love);  background: var(--love-soft);  box-shadow: var(--shadow-love); }
.day-cell.is-possible { border-color: var(--lilac); background: var(--lilac-soft); }
.day-cell.is-leave    { background: var(--leave-bg); border-color: var(--leave-border); }
.day-cell.is-afterwork { border-color: var(--teal); background: var(--teal-soft); }

.day-num { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; line-height: 1; }
.day-cell.is-today     .day-num { color: var(--gold); }
.day-cell.is-love      .day-num { color: var(--love); }
.day-cell.is-possible  .day-num { color: var(--lilac); }
.day-cell.is-afterwork .day-num { color: var(--teal); }

.tag {
  display: block;
  font-size: 9px;
  font-weight: 600;
  padding: 2px 5px;
  border-radius: var(--radius-tag);
  margin-bottom: 3px;
  line-height: 1.4;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.t-intensive  { background: var(--yellow-soft); color: var(--yellow-text); border: 1px solid #F5C518; }
.t-flexible   { background: #FFF8E1;            color: #E65100;            border: 1px solid #FFB74D; }
.t-lighter    { background: var(--blue-soft);   color: var(--blue-text);   border: 1px solid #A8D0F0; }
.t-leave      { background: var(--leave-bg);    color: var(--leave-text);  border: 1px solid var(--leave-border); }
.t-red        { background: var(--red-soft);    color: var(--red-text);    border: 1px solid #FFAAAA; }
.t-kt-work    { background: #F0F0F8;            color: var(--muted);       border: 1px solid var(--border); }
.t-kt-off     { background: var(--green-soft);  color: var(--green-text);  border: 1px solid #A8DDB5; }
.t-love       { background: var(--love-soft);   color: var(--love-text);   border: 1.5px solid var(--love); }
.t-possible   { background: var(--lilac-soft);  color: var(--lilac-text);  border: 1.5px solid var(--lilac); }
.t-afterwork  { background: var(--teal-soft);   color: var(--teal-text);   border: 1.5px solid var(--teal); }

.list-wrap { padding: 12px 14px 28px; display: none; }
.list-wrap.visible { display: block; }
.list-month-section { display: none; }
.list-month-section.visible { display: block; }
.list-month-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }

.list-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  border: 1.5px solid var(--border);
  background: var(--white);
}
.list-row.row-love      { background: var(--love-soft);  border-color: var(--love); }
.list-row.row-possible  { background: var(--lilac-soft); border-color: var(--lilac); }
.list-row.row-leave     { background: var(--leave-bg);   border-color: var(--leave-border); }
.list-row.row-afterwork { background: var(--teal-soft);  border-color: var(--teal); }

.list-date { width: 58px; flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--muted); padding-top: 2px; }
.list-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.list-tags .tag { margin-bottom: 0; }

footer { text-align: center; padding: 14px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--border); background: var(--white); }
</style>
</head>
<body>

<div class="header">
  <div class="header-names">Efua <span class="heart">♡</span> KT</div>
  <div class="header-sub">June – December 2026 · Schedule Overview</div>
</div>

<div class="legend">
  <div class="legend-item"><div class="ldot" style="background:#FFFBEA;border:1px solid #F5C518"></div>Efua intensive (MAT)</div>
  <div class="legend-item"><div class="ldot" style="background:#FFF8E1;border:1px solid #FFB74D"></div>Efua flexible (Gynae)</div>
  <div class="legend-item"><div class="ldot" style="background:#EAF3FC;border:1px solid #4A90D9"></div>Efua lighter (OBS ER / LW1 / MAT Float)</div>
  <div class="legend-item"><div class="ldot" style="background:#F5F5F5;border:1px solid #CCC"></div>Efua on leave</div>
  <div class="legend-item"><div class="ldot" style="background:#FFF0F0;border:1px solid #E03131"></div>30hr shift / Duty weekend</div>
  <div class="legend-item"><div class="ldot" style="background:#EBFBEE;border:1px solid #2F9E44"></div>KT off</div>
  <div class="legend-item"><div class="ldot" style="background:#FFF0F5;border:1.5px solid #FF2D78"></div>♡ Love window</div>
  <div class="legend-item"><div class="ldot" style="background:#F5EEFF;border:1.5px solid #9B59B6"></div>♡ Possible</div>
  <div class="legend-item"><div class="ldot" style="background:#E0F7FA;border:1.5px solid #0097A7"></div>⏰ Time after work</div>
</div>

<div class="tabs-wrap" id="tabsWrap">
  <button class="tab" data-id="jun" onclick="showMonth(this,'jun')">June</button>
  <button class="tab" data-id="jul" onclick="showMonth(this,'jul')">July</button>
  <button class="tab" data-id="aug" onclick="showMonth(this,'aug')">August</button>
  <button class="tab" data-id="sep" onclick="showMonth(this,'sep')">September</button>
  <button class="tab" data-id="oct" onclick="showMonth(this,'oct')">October</button>
  <button class="tab" data-id="nov" onclick="showMonth(this,'nov')">November</button>
  <button class="tab" data-id="dec" onclick="showMonth(this,'dec')">December</button>
  <div class="view-toggle">
    <button class="vtab active" onclick="setView('cal',this)">Grid</button>
    <button class="vtab" onclick="setView('list',this)">List</button>
  </div>
</div>

<div id="summaryBar" class="summary-bar"></div>
<div class="cal-wrap" id="calWrap"></div>
<div class="list-wrap" id="listWrap"></div>

<footer>Today highlighted in gold &nbsp;·&nbsp; ♡ marks your windows together</footer>

<script>
// ─── EFUA STATION MAP ─────────────────────────────────────────────────────────
const efuaMap = {};
function setRange(from, to, val) {
  const d = new Date(from), end = new Date(to);
  while (d <= end) {
    efuaMap[d.toISOString().slice(0,10)] = val;
    d.setDate(d.getDate()+1);
  }
}

// Jun
setRange('2026-06-08','2026-06-14','OBS_ER');
setRange('2026-06-15','2026-06-21','MAT2');
setRange('2026-06-22','2026-06-28','MAT1');
setRange('2026-06-29','2026-07-05','LW1');
// Jul
setRange('2026-07-06','2026-07-12','GYNAE2');
setRange('2026-07-13','2026-07-19','GYNAE1');
setRange('2026-07-20','2026-07-26','OBS_ER');
setRange('2026-07-27','2026-08-02','MAT2');
// Aug
setRange('2026-08-03','2026-08-09','MAT1');
setRange('2026-08-10','2026-08-16','MAT_FLOAT');
setRange('2026-08-17','2026-08-19','LW1');
setRange('2026-08-20','2026-09-15','LEAVE');
// Sep
setRange('2026-09-16','2026-09-20','MAT_FLOAT');
setRange('2026-09-21','2026-09-27','LW1');
setRange('2026-09-28','2026-10-04','GYNAE2');
// Oct
setRange('2026-10-05','2026-10-11','GYNAE1');
setRange('2026-10-12','2026-10-18','MAT_FLOAT');
setRange('2026-10-19','2026-10-25','GYNAE2');
setRange('2026-10-26','2026-11-01','MAT1');
// Nov
setRange('2026-11-02','2026-11-05','OBS_ER');
setRange('2026-11-06','2026-11-08','MAT_FLOAT');
setRange('2026-11-09','2026-11-15','LW1');
setRange('2026-11-16','2026-11-22','GYNAE2');
setRange('2026-11-23','2026-11-29','MAT_FLOAT');
setRange('2026-11-30','2026-12-01','MAT1');

// ─── DUTY WEEKENDS ────────────────────────────────────────────────────────────
const dutyWeekends = new Set([
  '2026-06-06',
  '2026-06-28',
  '2026-07-12',
  '2026-08-02',
  '2026-08-16',
  '2026-09-06',
  '2026-09-20',
  '2026-10-11',
  '2026-10-25',
  '2026-11-15',
  '2026-11-29',
]);

// ─── KT SCHEDULE ─────────────────────────────────────────────────────────────
// Jun 9–13:  work
// Jun 14–18: off
// Jun 19:    10-on/5-off cycle begins
function getKtStatus(ds) {
  const d     = new Date(ds);
  const jun9  = new Date('2026-06-09');
  const jun13 = new Date('2026-06-13');
  const jun14 = new Date('2026-06-14');
  const jun18 = new Date('2026-06-18');
  const jun19 = new Date('2026-06-19');
  if (d < jun9)   return null;
  if (d <= jun13) { const day = Math.floor((d - jun9) / 86400000) + 1; return { status:'work', label:'Day '+day }; }
  if (d <= jun18) { const day = Math.floor((d - jun14) / 86400000) + 1; return { status:'off',  label:'Off '+day }; }
  const days = Math.floor((d - jun19) / 86400000);
  const pos  = days % 15;
  if (pos < 10) return { status:'work', label:'Day '+(pos+1) };
  return { status:'off', label:'Off '+(pos-9) };
}

// Helper to get just status string
function ktStatus(ds) {
  const r = getKtStatus(ds);
  return r ? r.status : null;
}

// ─── STATION TYPES ───────────────────────────────────────────────────────────
const INTENSIVE = new Set(['MAT1','MAT2']);
const FLEXIBLE  = new Set(['GYNAE1','GYNAE2']);
const LIGHTER   = new Set(['OBS_ER','LW1','MAT_FLOAT']);

function stLabel(s) {
  return {
    MAT1:'MAT 1', MAT2:'MAT 2',
    GYNAE1:'Gynae 1', GYNAE2:'Gynae 2',
    OBS_ER:'OBS ER', LW1:'LW 1',
    MAT_FLOAT:'MAT Float', LEAVE:'On Leave'
  }[s] || s;
}

function pad(n){ return String(n).padStart(2,'0'); }
function ds(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function dow(s){ return new Date(s).getDay(); } // 0=Sun
function isFri(s){ return dow(s)===5; }
function isSat(s){ return dow(s)===6; }
function isSun(s){ return dow(s)===0; }
function isMon(s){ return dow(s)===1; }
function isMonToThu(s){ const d=dow(s); return d>=1&&d<=4; }
function prevDs(dateStr){ const d=new Date(dateStr); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }

// ─── CURRENT MONTH ────────────────────────────────────────────────────────────
const MONTH_IDS = ['jun','jul','aug','sep','oct','nov','dec'];
const MONTH_NUMS = [6,7,8,9,10,11,12];

function getCurrentMonthId() {
  const now = new Date();
  const m = now.getMonth()+1; // 1-based
  const idx = MONTH_NUMS.indexOf(m);
  if (idx !== -1) return MONTH_IDS[idx];
  // If before June, show June; if after Dec, show Dec
  if (m < 6) return 'jun';
  return 'dec';
}

// ─── WEEK LOVE LOGIC ──────────────────────────────────────────────────────────
const weekCache = {};

function getWeekStart(dateStr) {
  const d = new Date(dateStr);
  const diff = d.getDay()===0 ? -6 : 1-d.getDay();
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}

function computeWeekLighterOverlap(dateStr) {
  const ws = getWeekStart(dateStr);
  if (weekCache[ws] !== undefined) return weekCache[ws];
  let lighterDays=0, ktOffInLighter=0;
  for (let i=0;i<7;i++) {
    const dd=new Date(ws); dd.setDate(dd.getDate()+i);
    const dstr=dd.toISOString().slice(0,10);
    const st=efuaMap[dstr];
    const ktR=getKtStatus(dstr);
    const ktS=ktR?ktR.status:null;
    if (LIGHTER.has(st)) lighterDays++;
    if (ktS==='off' && LIGHTER.has(st)) ktOffInLighter++;
  }
  const isLighterWeek = lighterDays >= 3;
  let result = null;
  if (isLighterWeek) {
    if (ktOffInLighter >= 2) result = 'love';
    else if (ktOffInLighter === 1) result = 'possible';
  }
  weekCache[ws] = result;
  return result;
}

function getDayFlags(dateStr) {
  const st  = efuaMap[dateStr];
  const ktR = getKtStatus(dateStr);
  const kt  = ktR ? ktR.status : null;
  const ktLabel = ktR ? ktR.label : null;
  const fri = isFri(dateStr);
  const sat = isSat(dateStr);
  const sun = isSun(dateStr);
  const duty    = dutyWeekends.has(dateStr);
  const dutyMon = isMon(dateStr) && dutyWeekends.has(prevDs(dateStr));

  let love      = null;
  let afterwork = false;

  if (kt === 'off' && st) {
    if (st === 'LEAVE') {
      love = 'love';
    } else if (LIGHTER.has(st)) {
      love = computeWeekLighterOverlap(dateStr);
    }
    if (FLEXIBLE.has(st) && isMonToThu(dateStr) && !duty && !dutyMon) {
      afterwork = true;
    }
  }

  return { st, kt, ktLabel, love, afterwork, fri, sat, sun, duty, dutyMon };
}

// ─── BUILD ───────────────────────────────────────────────────────────────────
const MONTHS = [
  {id:'jun',label:'June 2026',     y:2026,m:6},
  {id:'jul',label:'July 2026',     y:2026,m:7},
  {id:'aug',label:'August 2026',   y:2026,m:8},
  {id:'sep',label:'September 2026',y:2026,m:9},
  {id:'oct',label:'October 2026',  y:2026,m:10},
  {id:'nov',label:'November 2026', y:2026,m:11},
  {id:'dec',label:'December 2026', y:2026,m:12},
];

function countMonthFlags(y,m) {
  const last=new Date(y,m,0).getDate();
  let love=0, possible=0, afterwork=0;
  for (let d=1;d<=last;d++) {
    const f=getDayFlags(ds(y,m,d));
    if (f.love==='love') love++;
    else if (f.love==='possible') possible++;
    if (f.afterwork) afterwork++;
  }
  return {love,possible,afterwork};
}

function buildAll() {
  const calWrap  = document.getElementById('calWrap');
  const listWrap = document.getElementById('listWrap');
  calWrap.innerHTML=''; listWrap.innerHTML='';

  MONTHS.forEach(({id,label,y,m})=>{
    const last = new Date(y,m,0).getDate();
    const fdow = (new Date(y,m-1,1).getDay()+6)%7;
    const counts = countMonthFlags(y,m);

    // Cal section
    const calSec=document.createElement('div');
    calSec.className='month-section';
    calSec.id='cal-'+id;
    calSec.innerHTML=`
      <div class="month-head">
        <span class="month-title">${label}</span>
        <span class="month-meta">${counts.love} love window${counts.love!==1?'s':''} · ${counts.possible} possible · ${counts.afterwork} after-work</span>
      </div>
      <div class="wday-row">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="wday">${d}</div>`).join('')}
      </div>
      <div class="days-grid" id="grid-${id}"></div>
    `;
    calWrap.appendChild(calSec);
    const grid=calSec.querySelector('.days-grid');
    for (let i=0;i<fdow;i++){const e=document.createElement('div');e.className='day-cell empty';grid.appendChild(e);}
    for (let d=1;d<=last;d++) grid.appendChild(buildCell(ds(y,m,d),d));

    // List section
    const lstSec=document.createElement('div');
    lstSec.className='list-month-section';
    lstSec.id='list-'+id;
    lstSec.innerHTML=`<div class="list-month-title">${label}</div>`;
    for (let d=1;d<=last;d++){const r=buildListRow(ds(y,m,d),d);if(r)lstSec.appendChild(r);}
    listWrap.appendChild(lstSec);
  });

  // Auto-open current month
  const currentId = getCurrentMonthId();
  const btn = document.querySelector(`.tab[data-id="${currentId}"]`);
  if (btn) showMonth(btn, currentId);
  else showMonth(document.querySelector('.tab[data-id="jun"]'), 'jun');
}

function buildCell(dateStr, d) {
  const f = getDayFlags(dateStr);
  const isToday = dateStr === new Date().toISOString().slice(0,10);

  let cls='day-cell';
  if (isToday) cls+=' is-today';
  // Priority: love > possible > afterwork > leave
  if (f.love==='love') cls+=' is-love';
  else if (f.love==='possible') cls+=' is-possible';
  else if (f.afterwork) cls+=' is-afterwork';
  else if (f.st==='LEAVE') cls+=' is-leave';

  let html=`<span class="day-num">${d}</span>`;

  // Efua tag
  if (f.st==='LEAVE') {
    html+=`<span class="tag t-leave">E: On Leave</span>`;
  } else if (f.duty && f.sun) {
    html+=`<span class="tag t-red">E: Duty Wknd</span>`;
  } else if (f.dutyMon) {
    html+=`<span class="tag t-red">E: Duty Mon</span>`;
  } else if (f.fri && f.st) {
    html+=`<span class="tag t-red">E: 30hr shift</span>`;
  } else if (f.sat && f.st) {
    html+=`<span class="tag t-red">E: Off 12pm</span>`;
  } else if (f.st && INTENSIVE.has(f.st)) {
    html+=`<span class="tag t-intensive">E: ${stLabel(f.st)}</span>`;
  } else if (f.st && FLEXIBLE.has(f.st)) {
    html+=`<span class="tag t-flexible">E: ${stLabel(f.st)}</span>`;
  } else if (f.st && LIGHTER.has(f.st)) {
    html+=`<span class="tag t-lighter">E: ${stLabel(f.st)}</span>`;
  }

  // KT tag
  if (f.kt==='work') html+=`<span class="tag t-kt-work">${f.ktLabel} · Working</span>`;
  else if (f.kt==='off') html+=`<span class="tag t-kt-off">${f.ktLabel} · Off ✓</span>`;

  // Flags
  if (f.love==='love') html+=`<span class="tag t-love">♡ Together</span>`;
  else if (f.love==='possible') html+=`<span class="tag t-possible">♡ Possible</span>`;
  if (f.afterwork) html+=`<span class="tag t-afterwork">⏰ After work</span>`;

  const cell=document.createElement('div');
  cell.className=cls; cell.innerHTML=html;
  return cell;
}

function buildListRow(dateStr, d) {
  const f=getDayFlags(dateStr);
  const kt=f.kt;
  const st=f.st;
  if (!kt&&!st) return null;

  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const dn=dayNames[new Date(dateStr).getDay()];

  let rowCls='list-row';
  if (f.love==='love') rowCls+=' row-love';
  else if (f.love==='possible') rowCls+=' row-possible';
  else if (f.afterwork) rowCls+=' row-afterwork';
  else if (st==='LEAVE') rowCls+=' row-leave';

  let tags='';
  if (st==='LEAVE') tags+=`<span class="tag t-leave">Efua: On Leave</span>`;
  else if (f.duty&&f.sun) tags+=`<span class="tag t-red">Efua: Duty Weekend · 6am–Mon 8pm</span>`;
  else if (f.dutyMon) tags+=`<span class="tag t-red">Efua: Duty Mon · until 8pm</span>`;
  else if (f.fri&&st) tags+=`<span class="tag t-red">Efua: 30hr shift · 6am–Sat 12pm</span>`;
  else if (f.sat&&st) tags+=`<span class="tag t-red">Efua: Post-shift · off by 12pm</span>`;
  else if (st&&INTENSIVE.has(st)) tags+=`<span class="tag t-intensive">Efua: ${stLabel(st)} · 7am–8pm</span>`;
  else if (st&&FLEXIBLE.has(st)) tags+=`<span class="tag t-flexible">Efua: ${stLabel(st)} · ~5pm Mon–Thu</span>`;
  else if (st&&LIGHTER.has(st)) tags+=`<span class="tag t-lighter">Efua: ${stLabel(st)} · closes 4:30pm</span>`;

  if (kt==='work') tags+=`<span class="tag t-kt-work">KT ${f.ktLabel} · 6am–7pm</span>`;
  else if (kt==='off') tags+=`<span class="tag t-kt-off">KT ${f.ktLabel} · Off ✓</span>`;

  if (f.love==='love') tags+=`<span class="tag t-love">♡ Love Window</span>`;
  else if (f.love==='possible') tags+=`<span class="tag t-possible">♡ Possible — confirm</span>`;
  if (f.afterwork) tags+=`<span class="tag t-afterwork">⏰ Likely time after work</span>`;

  const row=document.createElement('div');
  row.className=rowCls;
  row.innerHTML=`<div class="list-date">${dn} ${d}</div><div class="list-tags">${tags}</div>`;
  return row;
}

function updateSummary(id) {
  const mo=MONTHS.find(m=>m.id===id);
  if (!mo) return;
  const {love,possible,afterwork}=countMonthFlags(mo.y,mo.m);
  document.getElementById('summaryBar').innerHTML=`
    <div class="summary-chip love-chip"><div class="chip-dot" style="background:var(--love)"></div>${love} love window${love!==1?'s':''}</div>
    <div class="summary-chip possible-chip"><div class="chip-dot" style="background:var(--lilac)"></div>${possible} possible</div>
    <div class="summary-chip teal-chip"><div class="chip-dot" style="background:var(--teal)"></div>${afterwork} after-work</div>
  `;
}

function showMonth(btn, id) {
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.month-section').forEach(s=>s.classList.remove('visible'));
  document.querySelectorAll('.list-month-section').forEach(s=>s.classList.remove('visible'));
  const c=document.getElementById('cal-'+id), l=document.getElementById('list-'+id);
  if(c)c.classList.add('visible');
  if(l)l.classList.add('visible');
  updateSummary(id);
  // Scroll tab into view
  btn.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function setView(v,btn) {
  document.querySelectorAll('.vtab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('calWrap').style.display=v==='cal'?'block':'none';
  const lw=document.getElementById('listWrap');
  lw.style.display=v==='list'?'block':'none';
  if(v==='list')lw.classList.add('visible');
}

buildAll();
</script>
</body>
</html>
